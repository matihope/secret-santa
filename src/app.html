<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="Secret Santa" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<script>
			// Theme before first paint (same logic as src/lib/theme.ts): the `theme` cookie, else the
			// device setting. A dark page adds darkreader-lock so Dark Reader leaves it alone.
			(() => {
				const os = matchMedia('(prefers-color-scheme: dark)');
				const apply = () => {
					const pick = document.cookie.match(/(?:^|; )theme=(light|dark)(?:;|$)/)?.[1];
					const dark = pick ? pick === 'dark' : os.matches;
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
					const lock = document.head.querySelector('meta[name="darkreader-lock"]');
					if (dark && !lock) {
						const meta = document.createElement('meta');
						meta.setAttribute('name', 'darkreader-lock');
						document.head.append(meta);
					} else if (!dark) lock?.remove();
				};
				apply();
				os.addEventListener('change', apply);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
